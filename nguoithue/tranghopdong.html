  <aside class="sidebar">

  <main class="main">
    <div class="page-header">
      <div>
        <h1>Hợp đồng của tôi</h1>
        
      </div>
    </div>

    <!-- CONTRACT CARD -->
    <div class="contract-inner">

      <div class="contract-head">
        <div class="contract-title">Hợp đồng #1</div>
        <span class="badge contract-badge">Còn hạn</span>
      </div>

      <div class="contract-body">
        <div class="c-row">
          
          <span class="c-k">Phòng:</span>
          <span class="c-v">Phòng 1</span>
        </div>

        <div class="c-row">
          
          <span class="c-k">Người đại diện:</span>
          <span class="c-v">Nguyễn Văn A</span>
        </div>

        <div class="c-row">
          
          <span class="c-k">Giá phòng:</span>
          <span class="c-v">3.000.000 đ</span>
        </div>

        <div class="c-row">
          
          <span class="c-k">Tiền cọc:</span>
          <span class="c-v">3.000.000 đ</span>
        </div>

        <div class="c-row">
          
          <span class="c-k">Thời hạn:</span>
          <span class="c-v">01/01/2026 – 01/01/2027</span>
        </div>

        <div class="c-row">
          
          <span class="c-k">Ghi chú:</span>
          <span class="c-v">Không có</span>
        </div>
      </div>

      
    </div>
