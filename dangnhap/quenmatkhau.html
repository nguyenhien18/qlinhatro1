<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quên mật khẩu</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <div class="card">
      <h1 class="title">Quên mật khẩu</h1>
      <p class="subtitle">Nhập Gmail của bạn</p>

      <form id="forgotForm">
        <div class="form-group">
          <label class="form-label" for="email">Gmail</label>
          <input
            class="input"
            id="email"
            name="email"
            type="email"
            placeholder="nhập gmail đã đăng ký"
            autocomplete="email"
            required
          />
        </div>

        <div class="row-left">
          <a class="link" href="login.html">← Quay lại đăng nhập</a>
        </div>

        <button class="btn" type="submit">Gửi yêu cầu</button>

        <p id="msg" class="msg"></p>
      </form>
    </div>
  </div>

  <script src="quenmatkhau.js"></script>
</body>
</html>
